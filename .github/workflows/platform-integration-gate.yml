name: Platform integration gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: platform-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Static CI build only. Production receives the restricted key from Vercel.
      VITE_GOOGLE_MAPS_API_KEY: AIzaSyA000000000000000000000000000000000
      DP_SKIP_PUBLIC_COPY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify platform integration contracts
        run: node scripts/test-platform-integration-gate.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
