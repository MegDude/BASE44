name: Playwright

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify local Playwright
        run: npm run pretest:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Founding Partner Collection browser contract
        run: npx playwright test tests/e2e/founding-partner-collection.spec.ts --reporter=list

      - name: Run Playwright tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --reporter=list 2>&1 | tee playwright-output.log

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-output.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
