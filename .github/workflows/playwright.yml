name: Playwright

on:
  pull_request:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Vercel preview base URL
        required: false
        type: string
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.preview_url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify consolidated recovery contracts
        run: npm run test:consolidated-recovery

      - name: Verify local Playwright
        run: npm run pretest:e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7

  vercel-preview-e2e:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 110
    needs: e2e
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://base-44-downtown-perks-live-git-codex-platform-a4a37c-meg-dude.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Wait for final Vercel preview
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$PLAYWRIGHT_BASE_URL/map?mode=resident&tab=map&filter=Legends" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Run viewport and route tests against Vercel
        run: npx playwright test
